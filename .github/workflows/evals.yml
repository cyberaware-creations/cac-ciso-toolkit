# The suites README.md says to "run all of these before any release", run on every push
# instead — because that instruction was already in the README when v0.1.4 shipped a
# Python-3.12-only construct that made a whole dashboard fail to import. A release checklist
# a human has to remember is not a check.
name: evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    # Pinned to 3.9 deliberately. A green run on a newer interpreter proves nothing about
    # the floor we publish — that is the entire lesson of v0.1.4/v0.1.5. Raise this only
    # together with FLOOR_MINOR in python-compat.sh and the Requirements section of README.md.
    name: Python floor (3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Every shipped .py compiles on the floor
        run: ./skills/risk-register/evals/python-compat.sh "$(command -v python3)"

      - name: Deterministic engines agree with their fixtures
        run: |
          python3 skills/risk-register/scripts/score_register.py self-test
          python3 skills/nist-csf/scripts/profile_analysis.py validate
          python3 skills/nist-csf/scripts/profile_analysis.py self-test
          python3 skills/nist-csf/scripts/csfa_compat.py self-test

      # The licensing gate on the bundled crosswalk data: ISO and CIS ship IDs
      # plus our own labels, never the official titles or normative text. The
      # `validate` step above enforces the same invariant from inside the shipped
      # skill; this is the build-time checker that owns the rule, and it also
      # covers the build tooling that never ships.
      - name: Crosswalk data carries no ISO/CIS verbatim text
        run: python3 tools/crosswalks/validate_crosswalks.py

      # Golden .csfa -> convert -> analyze -> render, on the floor. Covers the
      # licensing gate on the shipped data, the opt-in rule, the hand-verified
      # headline numbers, and the report's own disclaimers. Refuses to report
      # success over a partial run — see its EXPECTED_CHECKS guard.
      - name: Crosswalk end-to-end, on the floor
        run: PY="$(command -v python3)" ./skills/nist-csf/evals/crosswalk-e2e.sh

      - name: Board-safety suite, on the floor
        run: PY="$(command -v python3)" ./skills/risk-register/evals/board-safety.sh

      # The board section contract, across both shipped consumers. The claim worth
      # protecting is that the contractVersion retrofit is additive: a sidecar written
      # before the contract existed renders byte-identically to a stamped one. This is
      # listed here rather than discovered, like every suite above — an eval CI does not
      # name is an eval that never runs.
      - name: Section contract, on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/section-contract.sh

      # Needs no browser, so it belongs here rather than behind the `rendered` job's
      # Chrome/node gate. It builds its register with the real CLI and asserts through the
      # renderers' own Context, so 3.9 is the interpreter that matters: this is the same
      # blind spot v0.1.4's 3.12-only construct lived in. The suite refuses to report
      # success over a partial run on its own — see its EXPECTED_CHECKS guard — rather
      # than relying on this job to notice, which is the lesson of the guard below.
      - name: Confirmation-age suite, on the floor
        run: PY="$(command -v python3)" ./skills/risk-register/evals/confirmation-age.sh

  rendered:
    # Width and WCAG AA contrast are properties of a *resolved layout*, so they need a real
    # layout engine. Four shipped defects lived in this blind spot.
    name: Rendered artifacts (width + contrast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          # contrast-check.mjs speaks CDP over Node's global WebSocket, which lands in 22.
          node-version: '22'

      - name: Require the tools responsive.sh would otherwise skip on
        # responsive.sh exits 0 when node or Chrome is missing, which is right for a laptop
        # and wrong for CI: a silently skipped check reports as a green tick. Fail loudly here
        # so the job can never pass without having actually measured anything.
        run: |
          command -v google-chrome >/dev/null || { echo "::error::google-chrome not on this runner; responsive.sh would skip and report a false green"; exit 1; }
          node -e 'if (+process.versions.node.split(".")[0] < 22) { console.error("::error::Node " + process.versions.node + " has no global WebSocket"); process.exit(1) }'

      - name: Width at 320/375/768/1265px, and AA contrast at 390/768/1280px
        run: ./skills/risk-register/evals/responsive.sh

  manifests:
    # A version that only moves in one of four places is the same class of bug as the
    # v0.1.4 Python-3.12 construct: a release step a human had to remember. 18cfec5
    # bumped plugin.json to 0.4.1 and left marketplace.json -- which is the file
    # `claude plugin update` actually reads -- at 0.4.0, so those fixes reached nobody.
    name: Version manifests agree, and moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-versions.py diffs against the merge base. A shallow clone has no
          # merge base, and the check would report an error it cannot resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: The guard's own self-test
        run: ./tools/check-versions.py --self-test

      # The guard reads git's path output and writes filenames back out, so it has to
      # survive a runner whose locale is not UTF-8 -- otherwise it crashes while
      # reporting a violation, which reads as a broken guard rather than a caught one.
      # All three variables are needed to actually reach ascii stdout: LC_ALL alone is
      # undone by PEP 538 coercion, and PEP 540 UTF-8 mode is on by default on newer
      # interpreters. Without them this assertion passes vacuously.
      - name: ...and again with a non-UTF-8 locale
        env:
          LC_ALL: C
          PYTHONCOERCECLOCALE: '0'
          PYTHONUTF8: '0'
        run: ./tools/check-versions.py --self-test

      - name: All four version strings agree
        run: ./tools/check-versions.py

      - name: Shipped changes carry a version bump
        if: github.event_name == 'pull_request'
        run: ./tools/check-versions.py --base "${{ github.event.pull_request.base.sha }}"

      # Defence in depth. The PR check above is only worth anything if this job is a
      # *required* status check -- a direct push or an admin merge bypasses it entirely,
      # and consistency alone would not have caught 18cfec5 (that commit was internally
      # consistent at every step; only the bump check catches it). Guarded against the
      # all-zero `before` that a branch's first push reports, which resolves to nothing.
      - name: Shipped changes carry a version bump (direct push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: ./tools/check-versions.py --base "${{ github.event.before }}"
