# The suites README.md says to "run all of these before any release", run on every push
# instead — because that instruction was already in the README when v0.1.4 shipped a
# Python-3.12-only construct that made a whole dashboard fail to import. A release checklist
# a human has to remember is not a check.
name: evals

on:
  push:
    # The prefix list is REQUIRED, and that is a finding rather than a preference.
    #
    # It was here originally because `pull_request` had stopped firing this workflow
    # repo-wide, leaving `push` as the only event that both ran the suite and produced a
    # check suite GitHub links to a PR. `pull_request` fires again, so the list looked
    # obsolete, and it was replaced with `tags-ignore: ['**']` — no branch filter, every
    # branch covered, no prefix list to fall out of date.
    #
    # That configuration fires on NOTHING. Not on a `docs/**` branch, and not on `main`:
    # the merge that introduced it produced CodeQL check-runs on the main head and no evals
    # run at all, while CodeQL fired on the same push. Reading the documentation, `push`
    # with only `tags-ignore` should match every branch. It does not here.
    #
    # So the list stays and is extended instead, because a list that is checked beats a
    # filter that silently matches nothing. `docs/**` is added — its absence was the actual
    # gap: a docs branch was validated only once a PR existed. ADD A PREFIX HERE when a new
    # one comes into use; there is no wildcard that works.
    #
    # A trigger change IS testable before it merges: GitHub reads this file from the ref
    # being pushed, not from the default branch. The branch that restored this list got a
    # push run from `fix/**` while main still carried the broken config, which settles it.
    #
    # That is worth stating because the obvious wrong conclusion was drawn first. When the
    # filterless version produced no run on a `chore/**` branch, the reading was "GitHub
    # decides which branches to watch from the default branch, so this cannot be tested
    # yet". It was not that. The branch was carrying the broken config itself, and the test
    # had already returned the right answer — it was the diagnosis that was wrong, and the
    # change was merged on the strength of it.
    #
    # So: push a branch with the new prefix and look for a push run. If none appears, the
    # filter does not work. Do not merge and check afterwards.
    branches: [main, 'feat/**', 'fix/**', 'docs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floor:
    # Pinned to 3.9 deliberately. A green run on a newer interpreter proves nothing about
    # the floor we publish — that is the entire lesson of v0.1.4/v0.1.5. Raise this only
    # together with FLOOR_MINOR in python-compat.sh and the Requirements section of README.md.
    name: Python floor (3.9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Every shipped .py compiles on the floor
        run: ./skills/risk-register/evals/python-compat.sh "$(command -v python3)"

      - name: Deterministic engines agree with their fixtures
        run: |
          python3 skills/risk-register/scripts/score_register.py self-test
          python3 skills/nist-csf/scripts/profile_analysis.py validate
          python3 skills/nist-csf/scripts/profile_analysis.py self-test
          python3 skills/nist-csf/scripts/csfa_compat.py self-test

      # The licensing gate on the bundled crosswalk data: ISO and CIS ship IDs
      # plus our own labels, never the official titles or normative text. The
      # `validate` step above enforces the same invariant from inside the shipped
      # skill; this is the build-time checker that owns the rule, and it also
      # covers the build tooling that never ships.
      # The checker's own tests come first, and they exist because it reported
      # "0 catalogs · 0 errors · 0 warnings" and exited 0 against an empty directory —
      # a clean bill from a run that read nothing. Running the guard before the data
      # it guards is the only order in which a green tick below means anything.
      - name: The crosswalk checker's own tests
        run: python3 tools/crosswalks/validate_crosswalks.py --self-test

      - name: Crosswalk data carries no ISO/CIS verbatim text
        run: python3 tools/crosswalks/validate_crosswalks.py

      # Golden .csfa -> convert -> analyze -> render, on the floor. Covers the
      # licensing gate on the shipped data, the opt-in rule, the hand-verified
      # headline numbers, and the report's own disclaimers. Refuses to report
      # success over a partial run — see its EXPECTED_CHECKS guard.
      - name: Crosswalk end-to-end, on the floor
        run: PY="$(command -v python3)" ./skills/nist-csf/evals/crosswalk-e2e.sh

      - name: Board-safety suite, on the floor
        run: PY="$(command -v python3)" ./skills/risk-register/evals/board-safety.sh

      # nist-csf rendered two board-facing dashboards for four phases with no inverted
      # suite of its own. Beyond the shared vocabulary rule it pins the two claims specific
      # to a Profile: a Tier is a judgment and not a score, and a coverage figure withheld
      # for thin assessment stays withheld on BOTH dashboards and on stdout — an agent
      # reads stdout and repeats it, so a number suppressed in the page and printed to the
      # terminal has not been suppressed.
      - name: Board-safety (nist-csf), on the floor
        run: PY="$(command -v python3)" ./skills/nist-csf/evals/board-safety.sh

      # The board section contract, across both shipped consumers. The claim worth
      # protecting is that the contractVersion retrofit is additive: a sidecar written
      # before the contract existed renders byte-identically to a stamped one. This is
      # listed here rather than discovered, like every suite above — an eval CI does not
      # name is an eval that never runs.
      - name: Section contract, on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/section-contract.sh

      # C-1. Every board-safety suite in the repo tested for ABSENCE and none for PRESENCE, so
      # a sidecar reading "Patch compliance fell to 88%." passed all of them. Listed here
      # individually for the reason stated two lines above this one.
      - name: Outcome framing (consequence, decision, no blending), on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/outcome-framing.sh

      # The release blocker from the v0.42.0 readiness test: two of the seven shipped sections
      # could not reach a page, because every eval here built on a five-section specimen.
      - name: Mixed evidence shapes reach both deliverables, on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/mixed-evidence.sh

      # The rest of board-pack. Phase D wired only the contract suite in, so the assembler's
      # own engine and its two behavioural suites shipped green and then never ran again —
      # exactly the failure the comment above names, committed one section below it.
      - name: Assembler self-test, on the floor
        run: python3 ./skills/board-pack/scripts/assemble_pack.py self-test

      - name: Assembly suite, on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/assembly.sh

      - name: Board-safety (board-pack), on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/board-safety.sh

      # Contrast in the .pptx. It belongs in this job rather than behind the `rendered`
      # job's Chrome gate because it needs no browser: `pptx_writer` emits explicit EMU
      # geometry and an explicit srgbClr on every run, so the pairing a viewer sees is
      # already written down and the scan walks the emitted XML.
      #
      # The deck was the one output format nothing measured, and that is how a band label
      # at 2.62:1 shipped in both outputs — nothing looked at the deck, and the browser
      # checker resolved SVG text against the page ground rather than the mark behind it,
      # so the two artifacts agreed with each other and both were wrong.
      - name: Deck contrast (board-pack), on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/deck-contrast.sh

      # Whether the deck HOLDS what the pack put in it, as opposed to whether the text can
      # be read. Pagination counted items, so eight decisions written the way a real risk
      # committee writes them ran off the bottom of the slide with nothing reporting it.
      # Its load-bearing case is behavioural — longer prose must cost more slides — which
      # no shared constant between the writer's estimate and the checker's can fake.
      - name: Deck fit (board-pack), on the floor
        run: PY="$(command -v python3)" ./skills/board-pack/evals/deck-fit.sh

      # incident-materiality shipped in Phase C with three suites and none of them listed
      # here. The disclosure-clock suite is the one that matters most: the SEC window runs
      # from the determination and not from discovery, and an off-by-one in business-day
      # arithmetic is a missed filing deadline rather than a wrong number on a page.
      - name: Incident engine self-test, on the floor
        run: python3 ./skills/incident-materiality/scripts/incident_analysis.py self-test

      - name: Disclosure-clock suite, on the floor
        run: PY="$(command -v python3)" ./skills/incident-materiality/evals/disclosure-clock.sh

      - name: Board-safety (incident), on the floor
        run: PY="$(command -v python3)" ./skills/incident-materiality/evals/board-safety.sh

      # business-context, and the applicability contract it owns. The clause worth CI time
      # is §2.2: a flag that is absent and one whose value is `null` must BOTH ask, and the
      # wrong implementation is `if not declared:` — which reads correctly, passes every
      # other test anyone writes, and silently narrows every assessment in the suite with
      # nothing on any rendered page to show it happened.
      #
      # There is no `business-context/evals/applicability.sh`, and its absence is deliberate
      # rather than an oversight: the owner's side of CAC-AP-1 is asserted inside the engine
      # self-test below (the five §2.2/§2.3 cases, plus subject-null and empty-wrapper
      # variants). The CONSUMER's side has its own suite, listed further down. Adding a third
      # file asserting the same things from the same constants would look like more coverage
      # and buy none. See docs/superpowers/plans/2026-08-07-business-context-implementation-plan.md.
      - name: Business-context engine self-test, on the floor
        run: python3 ./skills/business-context/scripts/business_context.py self-test

      # The guardrail on the revenue base. Listed because it runs the guard against a
      # deliberately poisoned copy: if `_derivedcheck` ever stops seeing a division by
      # revenue, this fails rather than continuing to report a clean bill.
      - name: No derived materiality, on the floor
        run: PY="$(command -v python3)" ./skills/business-context/evals/no-derived-materiality.sh

      # The archetype layer is ADVICE ABOUT DEPTH, never scope. A release test proved the
      # separation held once, by hand; this runs the same A/B on every push, because "a small
      # organisation probably does not need the AI battery" is one plausible line away at any
      # time and would be an exemption nobody declared.
      - name: Archetype advises depth and never scope, on the floor
        run: PY="$(command -v python3)" ./skills/business-context/evals/archetype-advisory.sh

      - name: Board-safety (business-context), on the floor
        run: PY="$(command -v python3)" ./skills/business-context/evals/board-safety.sh

      # BL-175, both directions. A profile flag is a dictionary of English sentences plus a
      # mapping, and nothing in this repo ever read either — so `listedEntity`, documented as
      # "shares admitted to trading — the SEC Item 1.05 perimeter", gated a four-business-day
      # Form 8-K deadline for twelve releases. Eight release tests reported it, and every one
      # of them had to notice it by reading. This is the check that fails instead.
      - name: One fact per flag, on the floor
        run: PY="$(command -v python3)" ./skills/business-context/evals/one-fact-per-flag.sh

      # BL-188, and it covers two skills — `ciso-board-translation` ships no evals directory,
      # so the guard lives with the other two locations. §500.19 was absent from `skills/`
      # entirely across five release tests: every NYDFS limit in the suite scoped OUTWARD, at
      # who the rule does not reach, and none said which covered entities inside the perimeter
      # are exempt. An exempt firm was told a lawful gap was non-compliance, and the toolkit's
      # own guidance then had it log an exception with a remediation timeline for an
      # obligation it does not have.
      - name: NYDFS exemptions stated and never computed, on the floor
        run: PY="$(command -v python3)" ./skills/exceptions-register/evals/nydfs-exemptions.sh

      # BL-188's D-4, generalised. Three outward-only limits survived that item's sweep because
      # answering them meant reading DORA and 17 CFR 229.106 rather than pattern-matching. The
      # second half freezes a near-miss: two shipped files correctly attach the DORA Art. 16
      # simplified-framework limit to the residual-risk receipts under RTS 2024/1774, so copying
      # it into the reporting receipt under RTS 2025/301 looks like consistency — and would be a
      # fabricated exemption, because Art. 16 disapplies Articles 5 to 15 and reporting is
      # Chapter III. It was one line from being written.
      - name: Regulatory limits run in both directions, on the floor
        run: PY="$(command -v python3)" ./skills/incident-materiality/evals/two-directional-limits.sh

      # GP-1.11's own tests. The coverage tool decides whether a guard's claim is supported, so
      # it runs before the claim does — the same ordering the crosswalk validator's self-test
      # has, and for the same reason: a green tick from a checker nobody checked means nothing.
      - name: Proof-coverage checker's own tests, on the floor
        run: python3 ./tools/proof-coverage.py --self-test

      # CAC-TW-1. Several functions and constants are duplicated across skills deliberately —
      # every shipped script must run standalone, so a shared module would need sys.path
      # surgery and would break the moment one skill directory is used on its own. Each
      # declaration says "edit the two together; each skill's own self-test is the only thing
      # pinning them", and a self-test inside one skill CANNOT SEE the other copy, by
      # construction. The drift arrived before the guard did: `evidence_text` rendered a number
      # on the weekly surface and a no-usable-evidence notice on the quarterly pack, from one
      # record, with a shipped docstring promising the two agreed (BL-191, BL-113).
      #
      # Its own tests first, for the reason directly above: a green tick from a checker nobody
      # checked means nothing.
      - name: Twin checker's own tests, on the floor
        run: python3 ./tools/check-twins.py --self-test

      - name: Every declared twin agrees, executed rather than read
        run: python3 ./tools/check-twins.py

      # Every consumer of CAC-AP-1, held to the contract from the side that DEFINES it.
      # Each consumer's own suite pins that consumer; none of them can see four engines
      # implementing the same six clauses and drifting apart one release at a time, each
      # suite still green because each is only ever asked about itself. It caught exactly
      # that on its first run: `incident-materiality` reported its decision per record and
      # the other three at the top level, so nothing could read all four the same way.
      #
      # The load-bearing case is behavioural — an undeclared profile must ask STRICTLY MORE
      # than one declaring the same flags false. That is §2.2, the clause whose failure
      # looks like a clean result, and no constant shared between suite and engine can fake it.
      - name: CAC-AP-1 consumers, on the floor
        run: PY="$(command -v python3)" ./skills/business-context/evals/consumers.sh

      # CAC-AP-1 across the file boundary — a profile decided in one skill and honoured by
      # another that must not import it. It also pins the additive guarantee: a profile that
      # narrows nothing leaves the analysis byte-identical, so `--context` cannot become a
      # flag that quietly changed the output of every run that never passes it.
      - name: Applicability contract (incident), on the floor
        run: PY="$(command -v python3)" ./skills/incident-materiality/evals/applicability.sh

      # Decision AP-2, on every push. The two directions it settles are the ones eight
      # release tests reproduced: a manufactured 8-K deadline for a non-registrant, and a
      # suppressed one for an unlisted s.15(d) reporter. Both are one flag apart, and a
      # withheld deadline that stops escalating is the second failure wearing the fix's
      # clothes — so this asserts the withholding AND the attention that survives it.
      - name: No clock without a declared perimeter, on the floor
        run: PY="$(command -v python3)" ./skills/incident-materiality/evals/scope-withheld.sh

      # metrics-register: the engine's own parity discipline, then the derivations through
      # the real CLI. Polarity is the case both exist for — a lower-better metric that
      # RISES is slipping, and the naive implementation reports it as an improvement,
      # which reads exactly like a correct answer in a board pack.
      - name: Metrics engine self-test, on the floor
        run: python3 ./skills/metrics-register/scripts/metrics_analysis.py self-test

      - name: Metric trend suite, on the floor
        run: PY="$(command -v python3)" ./skills/metrics-register/evals/metric-trend.sh

      - name: Board-safety (metrics), on the floor
        run: PY="$(command -v python3)" ./skills/metrics-register/evals/board-safety.sh

      # exceptions-register: the refusal discipline is the product, so the suite's
      # centrepiece is that a refused command leaves the store byte-identical. It also
      # pins that a lapsed clock surfaces an item and never removes it, and that the
      # one-way risk-register bridge is idempotent.
      - name: Exceptions engine self-test, on the floor
        run: python3 ./skills/exceptions-register/scripts/exceptions_register.py self-test

      - name: Re-validation lifecycle suite, on the floor
        run: PY="$(command -v python3)" ./skills/exceptions-register/evals/revalidation-lifecycle.sh

      - name: Board-safety (exceptions), on the floor
        run: PY="$(command -v python3)" ./skills/exceptions-register/evals/board-safety.sh

      # The third-party register. The engine self-test carries the criticality walk; the
      # no-vendor-score guard is listed separately because it is the one check that stops
      # this skill turning into every other third-party tool, and it has two halves that
      # catch different things — an emitted key named like a score, and a score computed
      # internally and renamed.
      #
      # Listed individually, like everything else here: a loop over evals/*.sh goes green
      # the day someone renames a directory.
      - name: Vendor engine self-test, on the floor
        run: python3 ./skills/vendor-register/scripts/vendor_register.py self-test

      - name: Criticality walk and the D-10 colour split, on the floor
        run: PY="$(command -v python3)" ./skills/vendor-register/evals/criticality.sh

      - name: No vendor score, on the floor
        run: PY="$(command -v python3)" ./skills/vendor-register/evals/no-vendor-score.sh

      - name: Evidence tiers, on the floor
        run: PY="$(command -v python3)" ./skills/vendor-register/evals/evidence-tiers.sh

      - name: The Layer A/B proposal boundary, on the floor
        run: PY="$(command -v python3)" ./skills/vendor-register/evals/proposal-boundary.sh

      - name: Generated questions and the subtraction, on the floor
        run: PY="$(command -v python3)" ./skills/vendor-register/evals/questions.sh

      - name: Board-safety (vendor), on the floor
        run: PY="$(command -v python3)" ./skills/vendor-register/evals/board-safety.sh

      - name: Decisions render (vendor), on the floor
        run: PY="$(command -v python3)" ./skills/vendor-register/evals/decisions-render.sh

      # The AI register. Two guards carry this skill and both are listed first, because
      # they are what make it a security register rather than a spreadsheet of tools:
      # exposure cannot be hand-selected away, and an attack class has no closed state.
      # Each has a behavioural half and a static half, and each is mutation-tested inside
      # its own suite — a guard nobody has watched fail is not known to work.
      #
      # Listed individually, like everything else here.
      - name: AI engine self-test, on the floor
        run: python3 ./skills/ai-register/scripts/ai_register.py self-test

      - name: No closed state on an attack class, on the floor
        run: PY="$(command -v python3)" ./skills/ai-register/evals/no-closed-state.sh

      - name: No AI score, on the floor
        run: PY="$(command -v python3)" ./skills/ai-register/evals/no-ai-score.sh

      - name: NISTAML exposure is derived, never selected, on the floor
        run: PY="$(command -v python3)" ./skills/ai-register/evals/exposure.sh

      - name: No regulatory date in prose, on the floor
        run: PY="$(command -v python3)" ./skills/ai-register/evals/no-regime-dates.sh

      - name: Generated questions and the tier boundary (AI), on the floor
        run: PY="$(command -v python3)" ./skills/ai-register/evals/questions.sh

      - name: Board-safety (AI), on the floor
        run: PY="$(command -v python3)" ./skills/ai-register/evals/board-safety.sh

      - name: Decisions render (AI), on the floor
        run: PY="$(command -v python3)" ./skills/ai-register/evals/decisions-render.sh

      # The attention surface. It owns no data, so its whole failure surface is what it
      # fails to SHOW: an unmapped trigger vanishing, an unread source looking clean, a
      # malformed item dropped. clusters.sh checks all three in both directions.
      - name: Attention surface engine self-test, on the floor
        run: python3 ./skills/attention-surface/scripts/attention_surface.py self-test

      - name: No priority score, on the floor
        run: PY="$(command -v python3)" ./skills/attention-surface/evals/no-priority-score.sh

      - name: Clusters, absence and malformed items, on the floor
        run: PY="$(command -v python3)" ./skills/attention-surface/evals/clusters.sh

      # The policy register, the twelfth skill. Its two load-bearing refusals are listed
      # first because they are what stop it becoming the thing it was built not to be: a
      # mapped policy is never evidence that a requirement is met, and this register reports
      # counts rather than proportions. Both are one plausible line away at any time — a
      # `covered` column and a completeness percentage are the two features anybody would ask
      # for first — and each is mutation-tested in its own suite.
      #
      # Listed individually, like everything else here. A loop over evals/*.sh goes green the
      # day someone renames a directory.
      - name: Policy engine self-test, on the floor
        run: python3 ./skills/policy-register/scripts/policy_register.py self-test

      - name: No coverage claim, on the floor
        run: PY="$(command -v python3)" ./skills/policy-register/evals/no-coverage-claim.sh

      - name: Counts never proportions, on the floor
        run: PY="$(command -v python3)" ./skills/policy-register/evals/no-coverage-percentage.sh

      # Supersession is the only way a document leaves force. The audit question is what was
      # in force on the date of the incident, so a delete command would make the register
      # answer the wrong question with complete confidence.
      - name: No deletion of a policy record, on the floor
        run: PY="$(command -v python3)" ./skills/policy-register/evals/no-deletion.sh

      # The vendored requirement spine against the nist-csf artifacts it was cut from.
      # Vendoring is what lets this skill run with nothing else installed; this is the cost
      # of it, paid on every push rather than discovered once a family label has drifted.
      - name: Vendored requirement spine has not drifted, on the floor
        run: PY="$(command -v python3)" ./skills/policy-register/evals/requirement-drift.sh

      - name: Board-safety (policy), on the floor
        run: PY="$(command -v python3)" ./skills/policy-register/evals/board-safety.sh

      # Behaviour through the real CLI rather than in-process: argparse, the store on disk,
      # and the refusal path a shell actually sees are all outside the self-test above, and
      # every one of them has broken in this repository before while a self-test stayed green.
      - name: Policy lifecycle through the CLI, on the floor
        run: PY="$(command -v python3)" ./skills/policy-register/evals/lifecycle.sh

      # CAC-GP-1. Every guard must FAIL when its defect is present, proved on each run rather
      # than once at authoring. Listed last because it re-runs each guard twice on a copy —
      # and listed at all because a guard that quietly stopped guarding prints `ok` forever.
      - name: Guard proofs (CAC-GP-1), on the floor
        run: PY="$(command -v python3)" ./tools/prove-guards.sh

      # CAC-LE-1. A check that was never registered cannot fail. `board-safety.sh` in
      # risk-register gained an outcome-framing check written with `ok`/`bad` in a suite that
      # declares `chk`; both arms were `command not found`, the failure counter never moved,
      # and the suite printed "all checks passed" and exited 0. Same class as the guard proofs
      # above, one layer down: this asserts the harness itself still counts.
      - name: Eval harness lint (CAC-LE-1) self-test, on the floor
        run: python3 ./tools/lint-evals.py --self-test

      - name: Eval harness lint (CAC-LE-1), on the floor
        run: python3 ./tools/lint-evals.py

      # CAC-RW-1. Before v0.52.0 exactly two source families in the product carried a
      # freshness stamp; every legal citation was undated at the point of use. The
      # v0.48.0-v0.51.0 pass read six families against their primary sources and found twelve
      # defects — every one an amendment failure that re-reading the repo could never have
      # caught. Three steps, listed individually per the house rule: the self-test proves the
      # checker still detects a drifted citation, the check runs it, and the release gate is
      # separate so a stale source is distinguishable from a broken manifest.
      - name: Source manifest (CAC-RW-1) self-test, on the floor
        run: python3 ./tools/check-sources.py --self-test

      - name: Source manifest (CAC-RW-1), on the floor
        run: python3 ./tools/check-sources.py

      - name: Source freshness release gate (CAC-RW-1.6), on the floor
        run: python3 ./tools/check-sources.py --release-gate

      # The five decisions-render guards. Each one pins the same shipped P1: the
      # sidecar carries decisions as {"text":..., "altitude":...} objects, the board
      # renderers stringified them, and every board pack printed a raw Python dict
      # where a decision should have been. They were written when that was fixed and
      # then never listed here, so for four skills the regression guard for a defect
      # that actually shipped has not run once since.
      #
      # And once listed, all five were green over a LIVE instance of that same defect for
      # another nine releases. `C.esc()` calls str() then html.escape(), so the object arrives
      # as `{&#x27;text&#x27;: ...}` and a grep for the literal `{'text'` finds nothing on a
      # page made of them — while risk-register's operational report, which no guard rendered,
      # shipped exactly that to a reader (BL-209 / BL-199). They now grep the escaped form,
      # refuse to read a page the renderer never wrote, and cover both renderers.
      #
      # Listed individually rather than globbed. A loop over evals/*.sh would go
      # green the day someone renames a directory, which is the failure mode the
      # comment above the section-contract entry names.
      - name: Decisions render (risk), on the floor
        run: PY="$(command -v python3)" ./skills/risk-register/evals/decisions-render.sh

      - name: Decisions render (nist-csf), on the floor
        run: PY="$(command -v python3)" ./skills/nist-csf/evals/decisions-render.sh

      - name: Decisions render (metrics), on the floor
        run: PY="$(command -v python3)" ./skills/metrics-register/evals/decisions-render.sh

      - name: Decisions render (exceptions), on the floor
        run: PY="$(command -v python3)" ./skills/exceptions-register/evals/decisions-render.sh

      - name: Decisions render (incident), on the floor
        run: PY="$(command -v python3)" ./skills/incident-materiality/evals/decisions-render.sh

      # The graphics library and the contract it is held to. The self-test proves each
      # mark in isolation -- including that no mark leaks a dict repr into a colour
      # attribute, which is the same class of defect as the decisions guards above and
      # shipped on this very branch. graphics-contract proves the renderer wired them
      # up: a metric with no threshold stays out of the RAG palette, a banded one's
      # mark carries its own status colour, and one metric renders as one mark in both
      # views.
      - name: Graphics library self-test, on the floor
        run: python3 ./tools/cac_graphics.py self-test

      - name: Graphics contract (metrics), on the floor
        run: PY="$(command -v python3)" ./skills/metrics-register/evals/graphics-contract.sh

      # Needs no browser, so it belongs here rather than behind the `rendered` job's
      # Chrome/node gate. It builds its register with the real CLI and asserts through the
      # renderers' own Context, so 3.9 is the interpreter that matters: this is the same
      # blind spot v0.1.4's 3.12-only construct lived in. The suite refuses to report
      # success over a partial run on its own — see its EXPECTED_CHECKS guard — rather
      # than relying on this job to notice, which is the lesson of the guard below.
      - name: Confirmation-age suite, on the floor
        run: PY="$(command -v python3)" ./skills/risk-register/evals/confirmation-age.sh

  rendered:
    # Width and WCAG AA contrast are properties of a *resolved layout*, so they need a real
    # layout engine. Four shipped defects lived in this blind spot.
    name: Rendered artifacts (width + contrast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          # contrast-check.mjs speaks CDP over Node's global WebSocket, which lands in 22.
          node-version: '22'

      - name: Require the tools responsive.sh would otherwise skip on
        # responsive.sh exits 0 when node or Chrome is missing, which is right for a laptop
        # and wrong for CI: a silently skipped check reports as a green tick. Fail loudly here
        # so the job can never pass without having actually measured anything.
        run: |
          command -v google-chrome >/dev/null || { echo "::error::google-chrome not on this runner; responsive.sh would skip and report a false green"; exit 1; }
          node -e 'if (+process.versions.node.split(".")[0] < 22) { console.error("::error::Node " + process.versions.node + " has no global WebSocket"); process.exit(1) }'

      - name: Width at 320/375/768/1265px, and AA contrast at 390/768/1280px
        run: ./skills/risk-register/evals/responsive.sh

  manifests:
    # A version that only moves in one of four places is the same class of bug as the
    # v0.1.4 Python-3.12 construct: a release step a human had to remember. 18cfec5
    # bumped plugin.json to 0.4.1 and left marketplace.json -- which is the file
    # `claude plugin update` actually reads -- at 0.4.0, so those fixes reached nobody.
    name: Version manifests agree, and moved
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-versions.py diffs against the merge base. A shallow clone has no
          # merge base, and the check would report an error it cannot resolve.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: The guard's own self-test
        run: ./tools/check-versions.py --self-test

      # The guard reads git's path output and writes filenames back out, so it has to
      # survive a runner whose locale is not UTF-8 -- otherwise it crashes while
      # reporting a violation, which reads as a broken guard rather than a caught one.
      # All three variables are needed to actually reach ascii stdout: LC_ALL alone is
      # undone by PEP 538 coercion, and PEP 540 UTF-8 mode is on by default on newer
      # interpreters. Without them this assertion passes vacuously.
      - name: ...and again with a non-UTF-8 locale
        env:
          LC_ALL: C
          PYTHONCOERCECLOCALE: '0'
          PYTHONUTF8: '0'
        run: ./tools/check-versions.py --self-test

      - name: All four version strings agree
        run: ./tools/check-versions.py

      - name: Shipped changes carry a version bump
        if: github.event_name == 'pull_request'
        run: ./tools/check-versions.py --base "${{ github.event.pull_request.base.sha }}"

      # Defence in depth. The PR check above is only worth anything if this job is a
      # *required* status check -- a direct push or an admin merge bypasses it entirely,
      # and consistency alone would not have caught 18cfec5 (that commit was internally
      # consistent at every step; only the bump check catches it). Guarded against the
      # all-zero `before` that a branch's first push reports, which resolves to nothing.
      #
      # Pinned to main, and that pin is load-bearing. `github.event.before` is the branch's
      # own previous SHA, which is the right base only when the branch IS the release line.
      # On a feature branch it asks a question with no sensible answer -- "did the version
      # move between these two commits of one PR?" -- and a version is bumped once per PR,
      # not once per commit. Adding feat/** and fix/** to this workflow's push trigger
      # briefly applied it there, and the first rebase that touched a shipped file failed a
      # branch whose version was already correct. The pull_request check above is what
      # guards feature branches; it compares against the base branch, which is the
      # comparison that means something.
      - name: Shipped changes carry a version bump (direct push to main)
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && github.event.before != '0000000000000000000000000000000000000000'
        run: ./tools/check-versions.py --base "${{ github.event.before }}"
